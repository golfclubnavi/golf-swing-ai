<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b8a45">

<title>Golf Swing AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#eef4ef;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:#142019;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  padding-bottom:84px;
  overflow:hidden;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  min-height:680px;
  background-image:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.15) 0%,
      rgba(255,255,255,.18) 28%,
      rgba(255,255,255,.10) 55%,
      rgba(0,70,30,.12) 100%
    ),
    url("369F6371-339B-47A3-B083-0620A213595D.png");

  background-size:cover;
  background-position:center center;
  display:flex;
  flex-direction:column;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.22) 0%,
    rgba(255,255,255,.05) 38%,
    rgba(0,0,0,.05) 100%
  );
  pointer-events:none;
}

.hero-top{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 0;
}

.icon-button{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.88);
  display:grid;
  place-items:center;
  font-size:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.hero-content{
  position:relative;
  z-index:2;
  text-align:center;
  padding:36px 24px 0;
}

.logo-icon{
  font-size:46px;
  line-height:1;
  margin-bottom:8px;
}

.logo-title{
  margin:0;
  color:#08743d;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-size:clamp(42px,11vw,58px);
  line-height:1;
  letter-spacing:-2px;
  text-shadow:
    0 2px 8px rgba(255,255,255,.9),
    0 1px 2px rgba(0,0,0,.05);
}

.logo-sub{
  margin-top:10px;
  color:#0c7d45;
  font-weight:800;
  font-size:17px;
}

.catch{
  margin:28px auto 0;
  max-width:340px;
  font-size:17px;
  line-height:1.8;
  font-weight:700;
  text-shadow:
    0 2px 9px rgba(255,255,255,.95),
    0 0 3px rgba(255,255,255,.95);
}

.hero-spacer{
  flex:1;
}

.hero-actions{
  position:relative;
  z-index:2;
  padding:0 22px 26px;
}

.main-btn{
  width:100%;
  min-height:62px;
  border:none;
  border-radius:999px;
  font-weight:800;
  font-size:18px;
  margin-top:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
  cursor:pointer;
}

.main-btn.primary{
  background:linear-gradient(135deg,#0da555,#078443);
  color:#fff;
}

.main-btn.secondary{
  background:rgba(255,255,255,.95);
  color:#18221b;
}

.main-btn span{
  margin-right:8px;
}

/* =========================
   INFO STRIP
========================= */

.info-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#fff;
  border-bottom:1px solid #e4e9e5;
}

.info-item{
  text-align:center;
  padding:20px 8px 18px;
  font-size:12px;
  line-height:1.45;
  font-weight:700;
  border-right:1px solid #edf0ed;
}

.info-item:last-child{
  border-right:none;
}

.info-icon{
  font-size:24px;
  margin-bottom:7px;
}

/* =========================
   RECENT
========================= */

.section{
  padding:22px 18px 28px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-title{
  margin:0;
  font-size:20px;
}

.link{
  color:#0b8747;
  font-size:13px;
  font-weight:700;
}

.swing-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.swing-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:18px;
  background:#f7faf7;
  border:1px solid #e5ebe6;
}

.thumb{
  width:78px;
  height:64px;
  border-radius:12px;
  background-image:url("369F6371-339B-47A3-B083-0620A213595D.png");
  background-size:cover;
  background-position:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}

.thumb::after{
  content:"🏌️‍♂️";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:26px;
  background:rgba(255,255,255,.04);
}

.swing-meta{
  min-width:0;
  flex:1;
}

.swing-date{
  font-size:12px;
  color:#6f7972;
  margin-bottom:4px;
}

.swing-name{
  font-size:15px;
  font-weight:800;
}

.score{
  color:#0a8243;
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
}

.score small{
  font-size:12px;
  margin-left:2px;
}

.arrow{
  color:#a0aaa2;
  margin-left:3px;
}

/* =========================
   START PANEL
========================= */

.start-panel{
  margin-top:18px;
  padding:20px;
  border-radius:20px;
  background:linear-gradient(135deg,#f4fbf6,#eef7ef);
  border:1px solid #dfeadf;
}

.start-title{
  font-weight:900;
  margin-bottom:5px;
}

.start-text{
  margin:0;
  color:#68736b;
  line-height:1.65;
  font-size:13px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.97);
  border-top:1px solid #dde4df;
  backdrop-filter:blur(16px);
  padding:
    8px 4px
    calc(8px + env(safe-area-inset-bottom));
}

.nav-item{
  text-align:center;
  color:#929a94;
  font-size:10px;
}

.nav-icon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#0a8747;
  font-weight:800;
}

/* =========================
   FILE INPUT
========================= */

.file-input{
  display:none;
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:100px;
  transform:translate(-50%,20px);
  width:calc(100% - 40px);
  max-width:450px;
  background:rgba(19,29,21,.95);
  color:#fff;
  padding:14px 18px;
  border-radius:14px;
  text-align:center;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   TABLET / PC
========================= */

@media(min-width:600px){
  body{
    padding:20px 0;
  }

  .app{
    border-radius:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.14);
  }

  .bottom-nav{
    border-radius:0 0 30px 30px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">

    <div class="hero-top">
      <button class="icon-button">☰</button>
      <button class="icon-button">🔔</button>
    </div>

    <div class="hero-content">

      <div class="logo-icon">🏌️‍♂️</div>

      <h1 class="logo-title">Golf Swing AI</h1>

      <div class="logo-sub">
        ゴルフスイングAI
      </div>

      <div class="catch">
        AIが、あなたのスイングを見える化。<br>
        上達への最短ルートをサポートします。
      </div>

    </div>

    <div class="hero-spacer"></div>

    <div class="hero-actions">

      <button class="main-btn primary" onclick="openCamera()">
        <span>📷</span>
        スイングを撮影する
      </button>

      <button class="main-btn secondary" onclick="openVideo()">
        <span>🖼️</span>
        動画から診断する
      </button>

    </div>

  </section>


  <section class="info-strip">

    <div class="info-item">
      <div class="info-icon">🧠</div>
      AIによる<br>
      スイング解析
    </div>

    <div class="info-item">
      <div class="info-icon">📊</div>
      わかりやすい<br>
      数値と評価
    </div>

    <div class="info-item">
      <div class="info-icon">📋</div>
      上達に役立つ<br>
      アドバイス
    </div>

  </section>


  <section class="section">

    <div class="section-head">
      <h2 class="section-title">最近のスイング</h2>
      <div class="link">すべて見る ›</div>
    </div>

    <div class="swing-list">

      <div class="swing-card">

        <div class="thumb"></div>

        <div class="swing-meta">
          <div class="swing-date">2026/08/22 13:30</div>
          <div class="swing-name">ドライバー</div>
        </div>

        <div class="score">
          78<small>点</small>
        </div>

        <div class="arrow">›</div>

      </div>


      <div class="swing-card">

        <div class="thumb"></div>

        <div class="swing-meta">
          <div class="swing-date">2026/08/20 10:15</div>
          <div class="swing-name">アイアン</div>
        </div>

        <div class="score">
          82<small>点</small>
        </div>

        <div class="arrow">›</div>

      </div>

    </div>


    <div class="start-panel">

      <div class="start-title">
        AIスイング診断を始めよう
      </div>

      <p class="start-text">
        スイングを撮影するか、保存済みの動画を選択してください。
        次のステップでスロー再生・骨格表示・関節角度の分析へ進みます。
      </p>

    </div>

  </section>

</div>


<input
  id="cameraInput"
  class="file-input"
  type="file"
  accept="video/*"
  capture="environment"
/>

<input
  id="videoInput"
  class="file-input"
  type="file"
  accept="video/*"
/>


<nav class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">⌂</span>
    ホーム
  </div>

  <div class="nav-item">
    <span class="nav-icon">▤</span>
    診断履歴
  </div>

  <div class="nav-item">
    <span class="nav-icon">♡</span>
    レッスン
  </div>

  <div class="nav-item">
    <span class="nav-icon">♙</span>
    マイページ
  </div>

</nav>


<div id="toast" class="toast"></div>


<script>

const cameraInput =
  document.getElementById("cameraInput");

const videoInput =
  document.getElementById("videoInput");

const toast =
  document.getElementById("toast");


function openCamera(){
  cameraInput.click();
}

function openVideo(){
  videoInput.click();
}

function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2400);

}


cameraInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      showToast(
        "撮影した動画を読み込みました！"
      );

    }

  }
);


videoInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      showToast(
        "動画を読み込みました！"
      );

    }

  }
);

</script>

</body>
</html>
