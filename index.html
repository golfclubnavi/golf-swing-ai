<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#078442">
<title>Golf Swing AI</title>
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0;background:#eef4ef;color:#172019;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit} .app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:#fff;padding-bottom:82px;overflow:hidden}
.hero{position:relative;height:calc(100svh - 82px);min-height:620px;max-height:720px;display:flex;flex-direction:column;background-image:linear-gradient(to bottom,rgba(255,255,255,.06),rgba(255,255,255,.08) 40%,rgba(0,0,0,.03)),url("369F6371-339B-47A3-B083-0620A213595D.png");background-size:cover;background-position:center}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(13px + env(safe-area-inset-top)) 22px 0;z-index:5} .top-icon{width:38px;height:38px;border:none;background:transparent;color:#076837}
.menu{display:flex;flex-direction:column;gap:5px} .menu span{width:27px;height:3px;background:#076837;border-radius:999px}
.bell{font-size:25px} .logo-area{text-align:center;padding:8px 18px 0;z-index:4} .logo-image{display:block;width:min(88%,390px);max-height:235px;object-fit:contain;margin:auto}
.catch{z-index:4;margin:2px auto 0;padding:0 18px;max-width:390px;text-align:center;font-size:16px;line-height:1.7;font-weight:800;text-shadow:0 2px 8px #fff,0 0 3px #fff}
.hero-space{flex:1;min-height:10px} .actions{z-index:5;padding:0 22px 18px} .action-btn{width:100%;min-height:56px;border:none;border-radius:999px;margin-top:11px;font-size:17px;font-weight:850;box-shadow:0 7px 20px rgba(0,0,0,.15)}
.primary{color:#fff;background:linear-gradient(135deg,#0bad55,#078442)} .secondary{color:#172019;background:rgba(255,255,255,.97)}
.features{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-bottom:1px solid #e4e9e4} .feature{padding:18px 6px;text-align:center;font-size:12px;line-height:1.45;font-weight:750;border-right:1px solid #e4e7e4} .feature:last-child{border-right:0}
.recent{padding:18px 14px 28px;background:#f6f8f6} .recent-card{padding:14px;background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.05)} .recent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px} .recent-title{font-size:19px;font-weight:850} .more{color:#078442;font-weight:800;font-size:13px}
.swing-row{display:flex;align-items:center;gap:11px;padding:11px 0} .swing-row+.swing-row{border-top:1px solid #e6e9e6} .thumb{width:88px;height:66px;border-radius:11px;background:url("369F6371-339B-47A3-B083-0620A213595D.png") center/cover;flex-shrink:0} .swing-info{flex:1} .date{color:#747d76;font-size:12px} .club{font-size:17px;font-weight:850} .score{color:#087842;font-size:27px;font-weight:900}
.bottom-nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid #dde3de;padding:8px 4px calc(8px + env(safe-area-inset-bottom))} .nav-item{text-align:center;color:#969d98;font-size:10px} .nav-item.active{color:#078442;font-weight:800} .nav-icon{display:block;font-size:22px}
@media(max-height:700px){.hero{min-height:580px}.logo-image{max-height:190px}.catch{font-size:14px}.action-btn{min-height:51px;font-size:16px}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<div class="topbar"><button class="top-icon"><div class="menu"><span></span><span></span><span></span></div></button><button class="top-icon bell">♧</button></div>
<div class="logo-area"><img class="logo-image" src="logo.PNG" alt="Golf Swing AI"></div>
<div class="catch">AIが、あなたのスイングを見える化。<br>上達への最短ルートをサポートします。</div>
<div class="hero-space"></div>
<div class="actions">
<button class="action-btn primary" onclick="location.href='camera.html'">📷　スイングを撮影する</button>
<button class="action-btn secondary" onclick="location.href='analyze.html'">🖼️　動画から診断する</button>
</div>
</section>
<section class="features">
<div class="feature">🧠<br>AIによる<br>スイング解析</div>
<div class="feature">▥<br>わかりやすい<br>数値と評価</div>
<div class="feature">☑<br>上達に役立つ<br>アドバイス</div>
</section>
<section class="recent"><div class="recent-card">
<div class="recent-head"><div class="recent-title">最近のスイング</div><div class="more">すべて見る ›</div></div>
<div class="swing-row"><div class="thumb"></div><div class="swing-info"><div class="date">2026/08/22 13:30</div><div class="club">ドライバー</div></div><div class="score">78<small>点</small></div></div>
<div class="swing-row"><div class="thumb"></div><div class="swing-info"><div class="date">2026/08/20 10:15</div><div class="club">アイアン</div></div><div class="score">82<small>点</small></div></div>
</div></section>
</div>
<nav class="bottom-nav"><div class="nav-item active"><span class="nav-icon">⌂</span>ホーム</div><div class="nav-item"><span class="nav-icon">▤</span>診断履歴</div><div class="nav-item"><span class="nav-icon">♡</span>レッスン</div><div class="nav-item"><span class="nav-icon">♙</span>マイページ</div></nav>
</body>
</html>
