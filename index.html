<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#078442">
<title>Golf Swing AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#eef4ef;
  color:#172019;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding-bottom:82px;
  overflow:hidden;
}

/* ===== TOP ===== */

.hero{
  position:relative;
  min-height:690px;

  background-image:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.08),
      rgba(255,255,255,.10) 38%,
      rgba(0,0,0,.03)
    ),
    url("369F6371-339B-47A3-B083-0620A213595D.png");

  background-size:cover;
  background-position:center;
}

.topbar{
  position:relative;
  z-index:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px 0;
}

.top-icon{
  border:none;
  background:transparent;
  width:40px;
  height:40px;
  color:#075f33;
  padding:0;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.menu span{
  display:block;
  width:27px;
  height:3px;
  background:#075f33;
  border-radius:3px;
}

.bell{
  position:relative;
  width:24px;
  height:27px;
  margin:auto;
}

.bell::before{
  content:"";
  position:absolute;
  left:3px;
  top:2px;
  width:18px;
  height:18px;
  border:3px solid #075f33;
  border-radius:12px 12px 7px 7px;
}

.bell::after{
  content:"";
  position:absolute;
  left:10px;
  bottom:0;
  width:5px;
  height:5px;
  background:#075f33;
  border-radius:50%;
}

/* ===== LOGO ===== */

.logo-area{
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px 18px 0;
}

.logo-symbol{
  width:82px;
  height:86px;
  margin:0 auto -2px;
}

.logo-symbol svg{
  width:100%;
  height:100%;
}

.logo-title{
  margin:0;
  color:#08753d;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-weight:700;
  font-size:clamp(42px,10.7vw,57px);
  line-height:1;
  letter-spacing:-2px;
  text-shadow:
    0 2px 7px rgba(255,255,255,.95),
    0 0 2px rgba(255,255,255,.95);
}

.logo-sub{
  margin-top:8px;
  color:#08753d;
  font-weight:800;
  font-size:17px;
}

.catch{
  margin:28px auto 0;
  max-width:360px;
  font-size:16px;
  line-height:1.8;
  font-weight:750;
  text-shadow:
    0 2px 8px rgba(255,255,255,.98),
    0 0 3px rgba(255,255,255,.98);
}

/* ===== ACTIONS ===== */

.actions{
  position:absolute;
  z-index:4;
  left:22px;
  right:22px;
  bottom:22px;
}

.action-btn{
  width:100%;
  min-height:60px;
  border:none;
  border-radius:999px;
  margin-top:12px;
  font-weight:800;
  font-size:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.15);
}

.action-btn.primary{
  background:linear-gradient(135deg,#0cad55,#078542);
  color:white;
}

.action-btn.secondary{
  background:rgba(255,255,255,.97);
  color:#172019;
}

.btn-icon{
  margin-right:8px;
}

/* ===== FEATURES ===== */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:white;
  border-bottom:1px solid #e4e9e4;
}

.feature{
  position:relative;
  padding:20px 7px 18px;
  text-align:center;
  font-size:12px;
  line-height:1.45;
  font-weight:750;
}

.feature:not(:last-child)::after{
  content:"";
  position:absolute;
  right:0;
  top:20%;
  width:1px;
  height:60%;
  background:#e4e7e4;
}

.feature-icon{
  display:block;
  margin-bottom:7px;
  color:#078442;
  font-size:26px;
}

/* ===== RECENT ===== */

.recent{
  padding:20px 16px 26px;
  background:#f7f9f7;
}

.recent-card{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.recent-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.recent-title{
  font-size:20px;
  font-weight:850;
}

.more{
  color:#078442;
  font-size:13px;
  font-weight:800;
}

.swing-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
}

.swing-row + .swing-row{
  border-top:1px solid #e6e9e6;
}

.thumb{
  width:92px;
  height:68px;
  border-radius:11px;
  background-image:url("369F6371-339B-47A3-B083-0620A213595D.png");
  background-size:cover;
  background-position:center;
  flex-shrink:0;
}

.swing-info{
  flex:1;
}

.date{
  color:#747d76;
  font-size:12px;
  margin-bottom:5px;
}

.club{
  font-size:17px;
  font-weight:850;
}

.score{
  color:#087842;
  font-size:28px;
  font-weight:900;
  white-space:nowrap;
}

.score small{
  font-size:12px;
}

.chev{
  color:#9ca49e;
  font-size:28px;
}

/* ===== NAV ===== */

.bottom-nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid #dde3de;
  padding:
    8px 4px
    calc(8px + env(safe-area-inset-bottom));
}

.nav-item{
  text-align:center;
  color:#969d98;
  font-size:10px;
}

.nav-icon{
  display:block;
  margin-bottom:4px;
  font-size:22px;
}

.nav-item.active{
  color:#078442;
  font-weight:800;
}

/* ===== INPUT ===== */

.hidden-input{
  display:none;
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:100px;
  transform:translate(-50%,20px);
  width:calc(100% - 40px);
  max-width:440px;
  padding:14px 16px;
  border-radius:14px;
  background:rgba(20,30,22,.95);
  color:#fff;
  text-align:center;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-height:760px){
  .hero{
    min-height:630px;
  }

  .logo-symbol{
    width:66px;
    height:69px;
  }

  .logo-title{
    font-size:41px;
  }

  .catch{
    margin-top:18px;
    font-size:15px;
  }

  .action-btn{
    min-height:54px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">

    <div class="topbar">

      <button class="top-icon" aria-label="メニュー">
        <div class="menu">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>

      <button class="top-icon" aria-label="通知">
        <div class="bell"></div>
      </button>

    </div>

    <div class="logo-area">

      <div class="logo-symbol">

        <svg viewBox="0 0 100 110" aria-hidden="true">

          <!-- club -->
          <path
            d="M21 26 L75 39"
            stroke="#08753d"
            stroke-width="4"
            stroke-linecap="round"
          />

          <circle cx="18" cy="25" r="5" fill="#08753d"/>

          <!-- head -->
          <circle cx="57" cy="39" r="9" fill="#08753d"/>

          <!-- body -->
          <path
            d="M50 48
               C44 54 43 64 46 75
               L49 97
               L61 97
               L63 73
               L70 83
               L80 77
               L67 58
               C64 52 59 47 50 48Z"
            fill="#08753d"
          />

          <!-- arms -->
          <path
            d="M51 51
               L67 39
               L72 45
               L59 60Z"
            fill="#08753d"
          />

          <path
            d="M58 52
               L73 40
               L78 46
               L65 61Z"
            fill="#08753d"
          />

          <!-- ball -->
          <circle cx="66" cy="99" r="7" fill="#08753d"/>

        </svg>

      </div>

      <h1 class="logo-title">
        Golf Swing AI
      </h1>

      <div class="logo-sub">
        ゴルフスイングAI
      </div>

      <div class="catch">
        AIが、あなたのスイングを見える化。<br>
        上達への最短ルートをサポートします。
      </div>

    </div>

    <div class="actions">

      <button class="action-btn primary" onclick="openCamera()">
        <span class="btn-icon">📷</span>
        スイングを撮影する
      </button>

      <button class="action-btn secondary" onclick="openVideo()">
        <span class="btn-icon">🖼️</span>
        動画から診断する
      </button>

    </div>

  </section>

  <section class="features">

    <div class="feature">
      <span class="feature-icon">🧠</span>
      AIによる<br>
      スイング解析
    </div>

    <div class="feature">
      <span class="feature-icon">▥</span>
      わかりやすい<br>
      数値と評価
    </div>

    <div class="feature">
      <span class="feature-icon">☑</span>
      上達に役立つ<br>
      アドバイス
    </div>

  </section>

  <section class="recent">

    <div class="recent-card">

      <div class="recent-head">
        <div class="recent-title">最近のスイング</div>
        <div class="more">すべて見る ›</div>
      </div>

      <div class="swing-row">

        <div class="thumb"></div>

        <div class="swing-info">
          <div class="date">2026/08/22 13:30</div>
          <div class="club">ドライバー</div>
        </div>

        <div class="score">
          78<small>点</small>
        </div>

        <div class="chev">›</div>

      </div>

      <div class="swing-row">

        <div class="thumb"></div>

        <div class="swing-info">
          <div class="date">2026/08/20 10:15</div>
          <div class="club">アイアン</div>
        </div>

        <div class="score">
          82<small>点</small>
        </div>

        <div class="chev">›</div>

      </div>

    </div>

  </section>

</div>

<input
  id="cameraInput"
  class="hidden-input"
  type="file"
  accept="video/*"
  capture="environment"
>

<input
  id="videoInput"
  class="hidden-input"
  type="file"
  accept="video/*"
>

<nav class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">⌂</span>
    ホーム
  </div>

  <div class="nav-item">
    <span class="nav-icon">▤</span>
    診断履歴
  </div>

  <div class="nav-item">
    <span class="nav-icon">♡</span>
    レッスン
  </div>

  <div class="nav-item">
    <span class="nav-icon">♙</span>
    マイページ
  </div>

</nav>

<div id="toast" class="toast"></div>

<script>

const cameraInput = document.getElementById("cameraInput");
const videoInput = document.getElementById("videoInput");
const toast = document.getElementById("toast");

function openCamera(){
  cameraInput.click();
}

function openVideo(){
  videoInput.click();
}

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

cameraInput.addEventListener("change",function(){

  if(this.files.length > 0){

    sessionStorage.setItem(
      "golfSwingVideoName",
      this.files[0].name
    );

    showToast(
      "撮影動画を読み込みました！"
    );

  }

});

videoInput.addEventListener("change",function(){

  if(this.files.length > 0){

    sessionStorage.setItem(
      "golfSwingVideoName",
      this.files[0].name
    );

    showToast(
      "動画を読み込みました！"
    );

  }

});

</script>

</body>
</html>
