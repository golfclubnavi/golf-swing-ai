<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b8a45">
<title>Golf Swing AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#eef4ef;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:#142019;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  padding-bottom:82px;
  overflow:hidden;
}

/* ===== HERO ===== */

.hero{
  position:relative;
  height:720px;
  min-height:720px;
  background-image:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.16) 0%,
      rgba(255,255,255,.14) 28%,
      rgba(255,255,255,.03) 58%,
      rgba(0,0,0,.04) 100%
    ),
    url("369F6371-339B-47A3-B083-0620A213595D.png");

  background-size:cover;
  background-position:center center;
}

.hero-top{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 0;
}

.top-btn{
  width:36px;
  height:36px;
  border:none;
  background:transparent;
  padding:0;
  display:grid;
  place-items:center;
  color:#0c3e28;
}

.menu-icon{
  width:26px;
  height:18px;
  position:relative;
}

.menu-icon span{
  position:absolute;
  left:0;
  width:100%;
  height:2px;
  background:#123f2b;
  border-radius:10px;
}

.menu-icon span:nth-child(1){ top:0; }
.menu-icon span:nth-child(2){ top:8px; }
.menu-icon span:nth-child(3){ top:16px; }

.bell{
  width:22px;
  height:24px;
  position:relative;
}

.bell:before{
  content:"";
  position:absolute;
  left:4px;
  top:2px;
  width:14px;
  height:15px;
  border:2px solid #123f2b;
  border-radius:9px 9px 5px 5px;
}

.bell:after{
  content:"";
  position:absolute;
  left:9px;
  bottom:0;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#123f2b;
}

/* ===== LOGO ===== */

.hero-content{
  position:relative;
  z-index:4;
  text-align:center;
  padding:18px 20px 0;
}

.logo-mark{
  width:70px;
  height:70px;
  margin:0 auto 4px;
}

.logo-mark svg{
  width:100%;
  height:100%;
  display:block;
}

.logo-title{
  margin:0;
  color:#0a713c;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-size:clamp(40px,10vw,54px);
  line-height:1;
  letter-spacing:-2px;
  text-shadow:
    0 2px 8px rgba(255,255,255,.95),
    0 0 2px rgba(255,255,255,.95);
}

.logo-sub{
  margin-top:7px;
  color:#0b7a43;
  font-weight:800;
  font-size:16px;
}

.catch{
  margin:22px auto 0;
  max-width:340px;
  font-size:16px;
  line-height:1.75;
  font-weight:700;
  text-shadow:
    0 2px 10px rgba(255,255,255,.98),
    0 0 3px rgba(255,255,255,.98);
}

/* ===== BUTTONS ===== */

.hero-actions{
  position:absolute;
  left:20px;
  right:20px;
  bottom:22px;
  z-index:5;
}

.main-btn{
  width:100%;
  min-height:58px;
  border:none;
  border-radius:999px;
  font-size:17px;
  font-weight:800;
  margin-top:12px;
  box-shadow:0 7px 22px rgba(0,0,0,.16);
  cursor:pointer;
}

.main-btn.primary{
  background:linear-gradient(135deg,#0ca653,#07833f);
  color:#fff;
}

.main-btn.secondary{
  background:rgba(255,255,255,.97);
  color:#162119;
}

.btn-icon{
  margin-right:8px;
}

/* ===== FEATURES ===== */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#fff;
  border-bottom:1px solid #e3e9e4;
}

.feature{
  padding:18px 7px 16px;
  text-align:center;
  font-size:11px;
  line-height:1.45;
  font-weight:700;
  border-right:1px solid #edf0ed;
}

.feature:last-child{
  border-right:none;
}

.feature-icon{
  display:block;
  font-size:22px;
  margin-bottom:6px;
}

/* ===== RECENT ===== */

.section{
  padding:20px 16px 26px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.section-title{
  margin:0;
  font-size:18px;
}

.more{
  color:#0a8547;
  font-size:12px;
  font-weight:700;
}

.swing-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.swing-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:15px;
  background:#f8faf8;
  border:1px solid #e5ebe6;
}

.thumb{
  width:72px;
  height:58px;
  border-radius:10px;
  background-image:url("369F6371-339B-47A3-B083-0620A213595D.png");
  background-size:cover;
  background-position:center;
  position:relative;
  overflow:hidden;
  flex-shrink:0;
}

.thumb:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,.06));
}

.swing-meta{
  flex:1;
  min-width:0;
}

.swing-date{
  color:#707973;
  font-size:11px;
  margin-bottom:3px;
}

.swing-name{
  font-size:14px;
  font-weight:800;
}

.score{
  color:#0a8243;
  font-size:22px;
  font-weight:900;
  white-space:nowrap;
}

.score small{
  font-size:11px;
}

.arrow{
  color:#a3aba5;
}

/* ===== BOTTOM NAV ===== */

.bottom-nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid #dde4df;
  padding:
    7px 4px
    calc(7px + env(safe-area-inset-bottom));
}

.nav-item{
  text-align:center;
  color:#929a94;
  font-size:10px;
}

.nav-icon{
  display:block;
  font-size:22px;
  line-height:1;
  margin-bottom:4px;
}

.nav-item.active{
  color:#0a8647;
  font-weight:800;
}

/* ===== INPUT ===== */

.file-input{
  display:none;
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:100px;
  transform:translate(-50%,20px);
  width:calc(100% - 40px);
  max-width:450px;
  background:rgba(19,29,21,.95);
  color:#fff;
  padding:14px 18px;
  border-radius:14px;
  text-align:center;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-height:750px){
  .hero{
    height:650px;
    min-height:650px;
  }

  .hero-content{
    padding-top:10px;
  }

  .logo-mark{
    width:58px;
    height:58px;
  }

  .logo-title{
    font-size:40px;
  }

  .catch{
    margin-top:16px;
    font-size:15px;
  }

  .main-btn{
    min-height:54px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">

    <div class="hero-top">

      <button class="top-btn" aria-label="メニュー">
        <div class="menu-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>

      <button class="top-btn" aria-label="通知">
        <div class="bell"></div>
      </button>

    </div>


    <div class="hero-content">

      <div class="logo-mark">

        <svg viewBox="0 0 100 100" aria-hidden="true">

          <circle cx="53" cy="21" r="7" fill="#0a713c"/>

          <path
            d="M49 28
               C44 34 43 42 45 50
               L50 62
               L44 82
               L52 84
               L59 64
               L67 81
               L75 77
               L63 56
               L61 43
               L73 50
               L78 45
               L62 33
               C58 29 54 27 49 28Z"
            fill="#0a713c"/>

          <path
            d="M45 35
               L28 26
               L25 31
               L44 44Z"
            fill="#0a713c"/>

          <path
            d="M27 27
               L71 18"
            stroke="#0a713c"
            stroke-width="4"
            stroke-linecap="round"/>

          <path
            d="M71 18
               L84 13"
            stroke="#0a713c"
            stroke-width="4"
            stroke-linecap="round"/>

        </svg>

      </div>

      <h1 class="logo-title">
        Golf Swing AI
      </h1>

      <div class="logo-sub">
        ゴルフスイングAI
      </div>

      <div class="catch">
        AIが、あなたのスイングを見える化。<br>
        上達への最短ルートをサポートします。
      </div>

    </div>


    <div class="hero-actions">

      <button
        class="main-btn primary"
        onclick="openCamera()"
      >
        <span class="btn-icon">📷</span>
        スイングを撮影する
      </button>

      <button
        class="main-btn secondary"
        onclick="openVideo()"
      >
        <span class="btn-icon">🖼️</span>
        動画から診断する
      </button>

    </div>

  </section>


  <section class="features">

    <div class="feature">
      <span class="feature-icon">🧠</span>
      AIによる<br>
      スイング解析
    </div>

    <div class="feature">
      <span class="feature-icon">📊</span>
      わかりやすい<br>
      数値と評価
    </div>

    <div class="feature">
      <span class="feature-icon">📋</span>
      上達に役立つ<br>
      アドバイス
    </div>

  </section>


  <section class="section">

    <div class="section-head">

      <h2 class="section-title">
        最近のスイング
      </h2>

      <div class="more">
        すべて見る ›
      </div>

    </div>


    <div class="swing-list">

      <div class="swing-card">

        <div class="thumb"></div>

        <div class="swing-meta">
          <div class="swing-date">
            2026/08/22 13:30
          </div>

          <div class="swing-name">
            ドライバー
          </div>
        </div>

        <div class="score">
          78<small>点</small>
        </div>

        <div class="arrow">
          ›
        </div>

      </div>


      <div class="swing-card">

        <div class="thumb"></div>

        <div class="swing-meta">
          <div class="swing-date">
            2026/08/20 10:15
          </div>

          <div class="swing-name">
            アイアン
          </div>
        </div>

        <div class="score">
          82<small>点</small>
        </div>

        <div class="arrow">
          ›
        </div>

      </div>

    </div>

  </section>

</div>


<input
  id="cameraInput"
  class="file-input"
  type="file"
  accept="video/*"
  capture="environment"
/>

<input
  id="videoInput"
  class="file-input"
  type="file"
  accept="video/*"
/>


<nav class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">⌂</span>
    ホーム
  </div>

  <div class="nav-item">
    <span class="nav-icon">▤</span>
    診断履歴
  </div>

  <div class="nav-item">
    <span class="nav-icon">♡</span>
    レッスン
  </div>

  <div class="nav-item">
    <span class="nav-icon">♙</span>
    マイページ
  </div>

</nav>


<div id="toast" class="toast"></div>


<script>

const cameraInput =
  document.getElementById("cameraInput");

const videoInput =
  document.getElementById("videoInput");

const toast =
  document.getElementById("toast");


function openCamera(){
  cameraInput.click();
}

function openVideo(){
  videoInput.click();
}

function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2400);

}


cameraInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      showToast(
        "撮影した動画を読み込みました！"
      );

    }

  }
);


videoInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      showToast(
        "動画を読み込みました！"
      );

    }

  }
);

</script>

</body>
</html>
